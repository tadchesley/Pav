<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pav logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 1200px;
    background: #09090B;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(129,140,248,0.22) 0px, transparent 55%),
      radial-gradient(circle at 50% 90%, rgba(34,197,94,0.10) 0px, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden;
  }
  .logo {
    display: inline-flex;
    align-items: baseline;
    gap: 28px;
  }
  .wordmark {
    font-size: 520px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.9;
    background: linear-gradient(135deg, #FFFFFF 0%, #A1A1AA 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .dot {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #22C55E;
    box-shadow: 0 0 80px rgba(34,197,94,0.55), 0 0 20px rgba(34,197,94,0.6);
  }
</style>
</head>
<body>
  <div class="logo">
    <span class="wordmark">Pav</span>
    <span class="dot"></span>
  </div>
</body>
</html>
