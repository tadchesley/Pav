<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pav square</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 1200px;
    background: #09090B;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(129,140,248,0.20) 0px, transparent 55%),
      radial-gradient(circle at 80% 100%, rgba(34,197,94,0.12) 0px, transparent 55%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #FAFAFA;
    overflow: hidden;
    padding: 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  /* Top: Pav logo */
  .brand {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand .word {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -0.045em;
    background: linear-gradient(135deg, #FFFFFF 0%, #D4D4D8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #22C55E;
    box-shadow: 0 0 24px rgba(34,197,94,0.6);
  }
  /* Middle: Tagline */
  .center {
    text-align: left;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid #27272A;
    background: rgba(24,24,27,0.6);
    color: #A1A1AA;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 32px;
  }
  .badge .spark { color: #818CF8; }
  .tagline {
    font-size: 144px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 0.96;
    background: linear-gradient(135deg, #FFFFFF 0%, #A1A1AA 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 36px;
  }
  .sub {
    font-size: 36px;
    line-height: 1.35;
    color: #A1A1AA;
    max-width: 880px;
  }
  .sub strong { color: #FAFAFA; font-weight: 600; }
  /* Bottom: stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 1px solid #27272A;
    border-radius: 24px;
    overflow: hidden;
    background: rgba(24,24,27,0.5);
  }
  .stat {
    padding: 28px 0;
    text-align: center;
    border-right: 1px solid #27272A;
  }
  .stat:last-child { border-right: none; }
  .stat .v { font-size: 44px; font-weight: 800; color: #FAFAFA; letter-spacing: -0.02em; }
  .stat .l { font-size: 18px; color: #71717A; margin-top: 6px; }
</style>
</head>
<body>
  <div class="brand">
    <span class="word">Pav</span>
    <span class="dot"></span>
  </div>

  <div class="center">
    <div class="badge"><span class="spark">✦</span> AI-powered market intelligence</div>
    <div class="tagline">The pulse<br/>of the market.</div>
    <div class="sub">
      AI stock predictions across <strong>871 tickers</strong> &mdash; stocks, crypto, FX, indices &amp; commodities. Free to start.
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="v">871</div><div class="l">Tickers</div></div>
    <div class="stat"><div class="v">7d</div><div class="l">AI horizon</div></div>
    <div class="stat"><div class="v">60s</div><div class="l">Live refresh</div></div>
    <div class="stat"><div class="v">24/7</div><div class="l">Crypto &amp; FX</div></div>
  </div>
</body>
</html>
